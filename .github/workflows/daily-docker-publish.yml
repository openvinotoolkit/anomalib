name: Daily Docker Publish

on:
  schedule:
    - cron: "0 2 * * *" # Nightly at 2 AM UTC
  workflow_dispatch: # Allow manual runs

permissions: {} # No permissions by default on workflow level

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish (${{ matrix.device }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # Checkout code
      packages: write # Push images to GHCR
      id-token: write # Cosign keyless signing (OIDC)

    strategy:
      fail-fast: false
      matrix:
        device: [cpu, xpu, cuda]

    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < application/VERSION)"
          SHORT_SHA="$(echo "$GITHUB_SHA" | head -c 8)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short-sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/open-edge-platform/anomalib-studio-${{ matrix.device }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}-dev-${{ steps.version.outputs.short-sha }}
            type=raw,value=${{ github.ref_name }}

      - name: Build and push Docker image
        uses: open-edge-platform/anomalib/.github/actions/docker-build@ec87c2162f08572b47eb1fea55ed819fd1a39b08
        with:
          device: ${{ matrix.device }}
          push: "true"
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          use-cache: "false"

      - name: Resolve primary image tag for signing
        id: primary-tag
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          # Use the first tag as the signing reference.
          # The sign-image action resolves the digest from this tag via crane.
          TAG="$(echo "$TAGS" | head -n1)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Sign Docker image
        uses: open-edge-platform/geti-ci/actions/sign-image@3690cbcc173cf90e0e0999b4822c3f8ebab9c137 # sign-image/v0.1.2
        with:
          image-uri: ${{ steps.primary-tag.outputs.tag }}
