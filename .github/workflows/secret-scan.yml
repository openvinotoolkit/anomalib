name: TruffleHog Secret Scan

permissions: {} # No permissions by default on workflow level

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Secret Scanning
        uses: trufflesecurity/trufflehog@a5f3de55cc2065ae4dde8fee24076f137fd62fcf # v3.97.8
        with:
          # Lob detector excluded: Python test function names (e.g. test_validate_gt_mask_invalid_dimensions)
          # match `\b(live|test)_[a-zA-Z0-9_]{35}\b` and Lob's API returns 403 for any well-formed string,
          # causing false-positive "verified" findings. Anomalib does not use the Lob postal API.
          extra_args: --results=verified,unknown --exclude-detectors=Lob --exclude-paths=.trufflehogignore
