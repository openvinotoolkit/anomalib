name: Dataset metadata fuzzing

on:
  pull_request:
    paths:
      - src/anomalib/data/**
      - tests/unit/data/utils/test_path_fuzz.py
      - tests/fuzz/**
      - tests/fuzzing.md
      - pyproject.toml
      - uv.lock
      - .github/workflows/fuzzing.yaml
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.10.4"
          enable-cache: false

      - name: Install test dependencies
        run: uv sync --locked --python 3.12 --extra test --extra cpu --extra fuzz

      - name: Verify the fuzzing oracle
        run: uv run --no-sync pytest tests/unit/data/utils/test_path_fuzz.py --timeout=120

      - name: Run bounded Atheris fuzzing
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '30' || '120' }}
          FUZZ_SEED: ${{ github.event_name == 'pull_request' && '3862' || '0' }}
          PYTHONFAULTHANDLER: "1"
        run: |
          mkdir -p fuzz-artifacts/corpus fuzz-artifacts/crashes
          set -o pipefail
          uv run --no-sync python tests/fuzz/fuzz_path.py fuzz-artifacts/corpus \
            -max_total_time="$FUZZ_SECONDS" -runs=100000 -seed="$FUZZ_SEED" \
            -max_len=1024 -timeout=10 -rss_limit_mb=4096 \
            -artifact_prefix=fuzz-artifacts/crashes/ -print_final_stats=1 \
            2>&1 | tee fuzz-artifacts/run.log

      - name: Preserve regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: metadata-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: fuzz-artifacts/
          if-no-files-found: ignore
          retention-days: 30
