# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: "ubuntu-24.04"
  tools:
    python: "3.12"
    nodejs: "24"
  jobs:
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest
    create_environment:
      - uv venv "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --frozen --extra docs
    pre_build:
      # Build the interactive benchmark dashboard and embed it as a static
      # asset. Depends on docs/benchmark-dashboard/ (see
      # docs/benchmark-dashboard/README.md).
      - cd docs/benchmark-dashboard && npm ci && npm run build:docs
      - rm -rf docs/source/_static/benchmarks
      - cp -r docs/benchmark-dashboard/dist-docs docs/source/_static/benchmarks

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/source/conf.py

# Optionally build your docs in additional formats such as PDF and ePub
formats:
  - pdf
  - epub
